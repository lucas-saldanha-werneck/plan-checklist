name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      # Pinned, so a new Claude Code release cannot change the result without a change here.
      - run: npm i -g @anthropic-ai/claude-code@2.1.322
      - run: claude plugin validate . && claude plugin test .
